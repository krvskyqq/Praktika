name: Test build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libx11-6 libxext6 libxrender1
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -v
      - name: Windows source GUI test
        if: runner.os == 'Windows'
        run: python main.py --self-test --test-result source-test.txt
      - name: Linux source GUI test
        if: runner.os == 'Linux'
        run: xvfb-run -a python main.py --self-test --test-result source-test.txt
      - run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name ContactManager main.py
      - name: Windows executable test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./dist/ContactManager.exe -ArgumentList '--self-test --test-result exe-test.txt' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Get-Content exe-test.txt) -ne 'PASS') { throw 'Executable self-test failed' }
          Compress-Archive -Path dist/ContactManager.exe,README.md,examples -DestinationPath ContactManager-windows-x64.zip
      - name: Linux executable test
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./dist/ContactManager --self-test --test-result exe-test.txt
          test "$(cat exe-test.txt)" = PASS
          tar -czf ContactManager-linux-x64.tar.gz -C dist ContactManager -C .. README.md examples
      - uses: actions/upload-artifact@v4
        with:
          name: ContactManager-${{ runner.os }}-x64
          path: |
            ContactManager-*.zip
            ContactManager-*.tar.gz
            dist/ContactManager.exe
            source-test.txt
            exe-test.txt
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="build-${GITHUB_RUN_NUMBER}"
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "Менеджер контактов $VERSION" --notes "Сборки Windows x64 и Linux x64. Модульные тесты и самопроверка GUI пройдены на обеих платформах." artifacts/ContactManager-windows-x64.zip artifacts/ContactManager-linux-x64.tar.gz artifacts/ContactManager.exe
